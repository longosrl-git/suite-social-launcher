<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Longo Social Suite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-raised:#FBF9F3;
    --ink:#1E2A38;
    --ink-soft:#4B5A6B;
    --blueprint:#2B4C7E;
    --line:#CFC6B3;
    --bad:#B5352D;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"IBM Plex Sans Condensed","Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    height:100vh; margin:0; padding:20px;
  }
  .card{
    width:100%; max-width:320px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:36px 28px;
    text-align:center;
    box-shadow:0 2px 10px rgba(30,42,56,.06);
  }
  .card img{width:64px; height:64px; display:block; margin:0 auto 18px;}
  .card h1{font-size:17px; font-weight:700; margin:0 0 4px;}
  .card .sub{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:0 0 24px;}

  label{display:block; text-align:left; font-size:12px; font-weight:600; margin:14px 0 4px;}
  input[type=text], input[type=password]{
    width:100%; font-family:inherit; font-size:14px;
    padding:8px 10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink);
  }
  .ricorda{display:flex; align-items:center; gap:6px; margin-top:12px; font-size:13px; text-align:left;}
  .ricorda input{width:auto;}

  .azioni{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  button{
    font-family:inherit; font-size:14px; font-weight:600;
    padding:11px 22px;
    border:1px solid var(--blueprint);
    background:var(--blueprint); color:#fff;
    border-radius:4px; cursor:pointer;
  }
  button:active{filter:brightness(1.1);}
  button:disabled{opacity:.6; cursor:default;}
  button.secondario{background:transparent; color:var(--ink-soft); border-color:var(--line);}

  #msg{font-size:13px; color:var(--bad); margin:12px 0 0; line-height:1.5; display:none;}
  .cambia{display:block; margin-top:16px; font-size:12px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0;}
  [hidden]{display:none!important;}
</style>
</head>

  <h1>Longo Social Suite</h1>
  <p class="sub">Dashboard</p>

  <!-- stato: nessuna credenziale salvata -->
  <form id="form-accedi">
    <label for="utente">Utente</label>
    <input type="text" id="utente" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <label class="ricorda"><input type="checkbox" id="ricorda" checked> Ricorda su questo telefono</label>
    <div class="azioni">
      <button type="submit" id="btn-accedi">Accedi</button>
    </div>
  </form>

  <!-- stato: credenziali già salvate -->
  <div class="azioni" id="azioni-pronte" hidden>
    <button type="button" id="btn-entra">Entra</button>
    <button type="button" class="secondario" id="btn-esci">Esci</button>
    <button type="button" class="cambia" id="btn-cambia">Cambia utente</button>
  </div>

  <p id="msg"></p>
</div>
<script>
  // Non contiene alcun dato riservato lato pagina: utente/password li
  // digita solo chi ha già l'app, e restano SOLO sul telefono (storage
  // nativo Capacitor Preferences, non il localStorage del browser: resta
  // valido anche quando il tunnel cambia dominio a ogni riavvio, cosa che
  // romperebbe qualunque salvataggio legato all'origine web).
  //
  // Volutamente NIENTE riconnessione automatica in background (era la
  // causa del loop segnalato: tornando indietro nell'app, la pagina si
  // ricaricava da sola e rientrava subito nella dashboard, creando un
  // rimbalzo continuo). Ora ogni passaggio è avviato solo da un tocco
  // esplicito su un pulsante.
  var CHIAVE = "ss_credenziali";
  var URL_JSON = "https://raw.githubusercontent.com/longosrl-git/suite-social-launcher/master/url.json";

  function preferenze() {
    return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) || null;
  }

  function mostraErrore(testo) {
    var el = document.getElementById("msg");
    el.textContent = testo;
    el.style.display = "block";
  }

  function nascondiErrore() {
    document.getElementById("msg").style.display = "none";
  }

  function mostraStatoLogin() {
    document.getElementById("form-accedi").hidden = false;
    document.getElementById("azioni-pronte").hidden = true;
  }

  function mostraStatoPronto() {
    document.getElementById("form-accedi").hidden = true;
    document.getElementById("azioni-pronte").hidden = false;
  }

  // Il login vero e proprio (POST utente/password) avviene QUI, da questa
  // pagina — non più sulla pagina di login della dashboard, il cui dominio
  // cambia a ogni riavvio del tunnel e su cui il bridge nativo Capacitor
  // non risulta affidabile (causa del "doppio login" segnalato). Il
  // server (src/dashboard/app.py, vedi consenti_cors_app) autorizza
  // esplicitamente le richieste da questa origine e restituisce JSON
  // invece del solito redirect quando riceve "via_app=1".
  function accedi(utente, password, ricorda, pulsante) {
    nascondiErrore();
    pulsante.disabled = true;

    fetch(URL_JSON + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.url) throw new Error("url mancante");
        var tunnelUrl = d.url;
        var dati = new URLSearchParams();
        dati.set("utente", utente);
        dati.set("password", password);
        dati.set("via_app", "1");
        return fetch(tunnelUrl + "/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: dati,
        }).then(function (r) {
          return r.json().then(function (esito) {
            return { esito: esito, tunnelUrl: tunnelUrl, status: r.status };
          });
        });
      })
      .then(function (res) {
        if (res.esito && res.esito.ok) {
          var vai = function () {
            window.location.replace(res.tunnelUrl + res.esito.destinazione);
          };
          if (ricorda && preferenze()) {
            preferenze()
              .set({ key: CHIAVE, value: JSON.stringify({ u: utente, p: password }) })
              .then(vai)
              .catch(vai);
          } else {
            vai();
          }
        } else {
          pulsante.disabled = false;
          mostraErrore((res.esito && res.esito.errore) || "Utente o password non corretti.");
        }
      })
      .catch(function () {
        pulsante.disabled = false;
        mostraErrore("Dashboard non raggiungibile al momento. Verifica che il PC di Longo sia acceso, poi riprova.");
      });
  }

  document.getElementById("form-accedi").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var utente = document.getElementById("utente").value;
    var password = document.getElementById("password").value;
    var ricorda = document.getElementById("ricorda").checked;
    accedi(utente, password, ricorda, document.getElementById("btn-accedi"));
  });

  document.getElementById("btn-entra").addEventListener("click", function () {
    var btn = document.getElementById("btn-entra");
    if (!preferenze()) {
      mostraErrore("Impossibile leggere le credenziali salvate.");
      return;
    }
    btn.disabled = true;
    preferenze().get({ key: CHIAVE }).then(function (res) {
      btn.disabled = false;
      if (!res || !res.value) {
        mostraStatoLogin();
        return;
      }
      var cred = JSON.parse(res.value);
      accedi(cred.u, cred.p, true, btn);
    });
  });

  document.getElementById("btn-esci").addEventListener("click", function () {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.exitApp();
    }
  });

  document.getElementById("btn-cambia").addEventListener("click", function () {
    if (preferenze()) {
      preferenze().remove({ key: CHIAVE }).then(mostraStatoLogin);
    } else {
      mostraStatoLogin();
    }
  });

  // all'avvio: se ci sono già credenziali salvate, entra subito da sola,
  // senza bisogno di toccare "Entra" — un solo login manuale (la prima
  // volta), poi mai più. Sicuro da fare qui, a differenza del tentativo
  // precedente che causava un rimbalzo: ora i redirect sostituiscono la
  // pagina invece di accumularsi nella cronologia, e il tasto indietro
  // chiude sempre l'app invece di poter tornare su questa pagina e
  // ripartire in un ciclo.
  var p = preferenze();
  if (p) {
    p.get({ key: CHIAVE }).then(function (res) {
      if (res && res.value) {
        mostraStatoPronto();
        var cred = JSON.parse(res.value);
        accedi(cred.u, cred.p, true, document.getElementById("btn-entra"));
      } else {
        mostraStatoLogin();
      }
    });
  } else {
    mostraStatoLogin();
  }

  // il tasto indietro del telefono chiude sempre l'app (stesso motivo
  // del listener in base.html della dashboard: più prevedibile del
  // comportamento predefinito di Capacitor)
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('backButton', function () {
      window.Capacitor.Plugins.App.exitApp();
    });
  }
</script>
</body>
</html>
