<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Longo Social Suite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-raised:#FBF9F3;
    --ink:#1E2A38;
    --ink-soft:#4B5A6B;
    --blueprint:#2B4C7E;
    --line:#CFC6B3;
    --bad:#B5352D;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"IBM Plex Sans Condensed","Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    height:100vh; margin:0; padding:20px;
  }
  .card{
    width:100%; max-width:320px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    padding:36px 28px;
    text-align:center;
    box-shadow:0 2px 10px rgba(30,42,56,.06);
  }
  .card img{width:64px; height:64px; display:block; margin:0 auto 18px;}
  .card h1{font-size:17px; font-weight:700; margin:0 0 4px;}
  .card .sub{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:0 0 24px;}

  .spinner{
    width:26px; height:26px; margin:0 auto 16px;
    border:3px solid var(--line);
    border-top-color:var(--blueprint);
    border-radius:50%;
    animation:girare .8s linear infinite;
  }
  @keyframes girare{to{transform:rotate(360deg);}}
  .spinner.nascosto{display:none;}

  #msg{font-size:14px; color:var(--ink-soft); margin:0 0 6px; line-height:1.5;}

  .azioni{display:none; gap:10px; justify-content:center; margin-top:14px;}
  button{
    font-family:inherit; font-size:14px; font-weight:600;
    padding:10px 22px;
    border:1px solid var(--blueprint);
    background:var(--blueprint); color:#fff;
    border-radius:4px; cursor:pointer;
  }
  button:active{filter:brightness(1.1);}
  button.secondario{background:transparent; color:var(--ink-soft); border-color:var(--line);}
</style>
</head>

  <h1>Longo Social Suite</h1>
  <p class="sub">Dashboard</p>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Connessione alla dashboard...</p>
  <div class="azioni" id="azioni">
    <button onclick="riavvia()">Riconnetti</button>
    <button class="secondario" onclick="esci()">Esci</button>
  </div>
</div>
<script>
  // Non contiene alcun dato riservato: solo l'URL pubblico (temporaneo,
  // cambia ad ogni riavvio del PC) del tunnel Cloudflare verso la
  // dashboard, che resta comunque protetta da login utente/password.
  var tentativi = 0;

  // ricarica la pagina da zero (non solo un nuovo fetch): così riparte
  // anche l'eventuale versione più recente della pagina stessa, non solo
  // il tentativo di trovare il tunnel — evita che uno script vecchio in
  // cache resti bloccato senza vie d'uscita
  function riavvia() {
    window.location.reload();
  }

  // chiude l'app: funziona solo dentro il contenitore nativo Capacitor
  // (non in un browser normale, dove non esiste un modo per farlo via
  // JavaScript — lì il pulsante semplicemente non compare, vedi sotto)
  function esci() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
      window.Capacitor.Plugins.App.exitApp();
    }
  }

  function tentaConnessione() {
    tentativi += 1;
    document.getElementById('azioni').style.display = 'none';
    document.getElementById('spinner').classList.remove('nascosto');
    document.getElementById('msg').textContent = 'Connessione alla dashboard...';
    document.getElementById('msg').style.color = '';

    // un fetch senza timeout può restare "appeso" all'infinito se la rete
    // torna a metà (es. l'app riappare in primo piano col wifi non ancora
    // riagganciato): senza questo limite la pagina resta bloccata sullo
    // spinner per sempre, senza mai mostrare il pulsante Riprova
    var risolto = false;
    var limite = setTimeout(function () {
      if (risolto) return;
      risolto = true;
      fallito();
    }, 7000);

    // raw.githubusercontent.com invece del percorso sulla stessa pagina:
    // la CDN di GitHub Pages tiene url.json in cache fino a 10 minuti anche
    // con cache-busting lato client, mentre raw.githubusercontent.com si
    // aggiorna in pratica subito — riduce di molto la finestra in cui
    // l'app punta ancora a un tunnel già caduto
    fetch('https://raw.githubusercontent.com/longosrl-git/suite-social-launcher/master/url.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (risolto) return;
        risolto = true;
        clearTimeout(limite);
        if (d && d.url) {
          window.location.replace(d.url);
        } else {
          fallito();
        }
      })
      .catch(function () {
        if (risolto) return;
        risolto = true;
        clearTimeout(limite);
        fallito();
      });
  }

  function fallito() {
    document.getElementById('spinner').classList.add('nascosto');
    document.getElementById('msg').textContent =
      'Dashboard non raggiungibile al momento. Verifica che il PC di Longo sia acceso, poi riconnetti.';
    document.getElementById('msg').style.color = '#B5352D';
    // nessun ritentativo automatico: l'utente decide lui quando
    // riconnettersi o uscire, invece di vedere la pagina ricaricarsi
    // da sola all'infinito in background
    document.getElementById('azioni').style.display = 'flex';
  }

  // il pulsante Esci ha senso solo dentro l'app (fuori da lì non c'è modo
  // di "chiudere" una pagina web via script) — nascosto se qualcuno apre
  // questo indirizzo da un browser normale
  if (!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)) {
    var btnEsci = document.querySelector('#azioni .secondario');
    if (btnEsci) btnEsci.style.display = 'none';
  }

  tentaConnessione();

  // quando l'app torna in primo piano (l'utente la riapre dopo averla
  // messa in background) ritenta subito da sola, invece di aspettare che
  // l'utente si accorga che è rimasta bloccata e tocchi Riprova.
  // visibilitychange è l'evento "da browser": non sempre affidabile dentro
  // una WebView nativa Android, quindi se l'app è quella Capacitor (rilevabile
  // da window.Capacitor) usiamo anche l'evento nativo App.resume, molto più
  // affidabile perché arriva direttamente dal sistema operativo
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      tentativi = 0;
      riavvia();
    }
  });

  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('resume', function () {
      riavvia();
    });
  }
</script>
</body>
</html>
